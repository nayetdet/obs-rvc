[project]
name = "plugin-worker"
version = "0.1.0"
description = "Retrieval-based Voice Conversion as an OBS plugin"
readme = "README.md"
license = "GPL-2.0-only"
authors = [
    { name = "nayetdet", email = "jpmoreiracampos21@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "iceoryx2>=0.9.0",
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "rvc",
    "torch",
    "torchaudio",
]

[project.scripts]
plugin-worker = "plugin_worker.main:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
rvc = { git = "https://github.com/nayetdet/Retrieval-based-Voice-Conversion" }
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[tool.uv]
override-dependencies = ["av==15.1.0"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
